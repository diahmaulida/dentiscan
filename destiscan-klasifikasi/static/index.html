<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentiscan - Klasifikasi Gigi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 { text-align: center; color: #333; }
        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            background-color: #f8fbff;
            transition: 0.3s;
        }
        .upload-area:hover { background-color: #e9f5ff; }
        #fileInput { display: none; }
        #preview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
        }
        .btn:hover { background-color: #0056b3; }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: #e8f5e9;
            border-left: 6px solid #4caf50;
            display: none;
        }
        .result-box.warning {
            background-color: #fff3e0;
            border-left: 6px solid #ff9800;
        }
        .result-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #2e7d32; }
        .result-box.warning .result-title { color: #e65100; }
        .result-desc { font-size: 15px; color: #555; margin-bottom: 15px; }
        .confidence-bar {
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        .confidence-fill {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }
        .result-box.warning .confidence-fill { background-color: #ff9800; }
        .confidence-text { text-align: right; font-size: 13px; font-weight: bold; margin-top: 5px; }
        .loading { text-align: center; color: #007bff; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🦷 Dentiscan Klasifikasi</h2>
    <p style="text-align: center; color: #666; font-size: 14px;">Unggah foto gigi untuk mendeteksi penyakit (AI)</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p>Klik di sini untuk memilih foto</p>
        <img id="preview" src="" alt="Preview">
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="previewImage(this)">

    <button id="btnDetect" class="btn" onclick="uploadImage()">Analisis Sekarang</button>
    <div id="loading" class="loading">⏳ Menganalisis gambar...</div>

    <div id="resultBox" class="result-box">
        <div class="result-title" id="resTitle">-</div>
        <div class="result-desc" id="resDesc">-</div>
        <div class="confidence-bar">
            <div class="confidence-fill" id="confFill"></div>
        </div>
        <div class="confidence-text" id="confText">0%</div>
    </div>
</div>

<script>
    const deskripsiPenyakit = {
        "Calculus": "Penumpukan plak atau karang gigi yang mengeras. Perlu pembersihan (scaling) oleh dokter gigi.",
        "Cancer": "Terdeteksi indikasi kanker mulut. SANGAT DISARANKAN untuk segera memeriksakan diri ke dokter spesialis.",
        "Caries": "Gigi berlubang akibat kerusakan enamel. Perlu penambalan atau perawatan saluran akar.",
        "Gingivitis": "Radang pada gusi. Gejala: gusi merah, bengkak, dan mudah berdarah. Perbaiki cara menyikat gigi.",
        "Ulcer": "Sariawan atau luka terbuka pada jaringan mulut. Biasanya sembuh dalam 1-2 minggu."
    };

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('btnDetect').style.display = 'block';
                document.getElementById('resultBox').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function uploadImage() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) return;

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);

        document.getElementById('btnDetect').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';

        try {
            const response = await fetch('/api/detect', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnDetect').style.display = 'block';

            if (data.error) {
                alert("Error: " + data.error);
                return;
            }

            if (data.detections && data.detections.length > 0) {
                const det = data.detections[0];
                const confPercent = (det.confidence * 100).toFixed(1);
                
                const resBox = document.getElementById('resultBox');
                resBox.style.display = 'block';
                
                // Jika confidence di bawah 60%, beri warna peringatan
                if (det.confidence < 0.60) {
                    resBox.classList.add('warning');
                    resBox.querySelector('.result-title').textContent = `⚠️ Hasil Kurang Yakin: ${det.class_name}`;
                } else {
                    resBox.classList.remove('warning');
                    resBox.querySelector('.result-title').textContent = `✅ Terdeteksi: ${det.class_name}`;
                }

                document.getElementById('resDesc').textContent = deskripsiPenyakit[det.class_name] || "Deskripsi belum tersedia.";
                document.getElementById('confFill').style.width = `${confPercent}%`;
                document.getElementById('confText').textContent = `Keyakinan AI: ${confPercent}%`;
            } else {
                alert("Tidak ada penyakit yang terdeteksi.");
            }
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnDetect').style.display = 'block';
            alert("Terjadi kesalahan saat menghubungi server.");
        }
    }
</script>

</body>
</html>
